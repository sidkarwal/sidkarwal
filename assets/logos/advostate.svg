<!-- Advostate mark. Sid co-founded the company (2017-2020, election campaign
     management, Northern India) and asked for a new mark on 2026-08-01, after a
     full-disk + Spotlight + web search found no trace of the original.
     Chosen from four options: an A knocked out of a solid block, referencing the
     rubber stamp that marks an Indian ballot. evenodd fill: square, minus the A,
     plus the A's counter.
     Colour is #16233A, the dark navy band of the site's locked Casey palette, NOT
     an invented hue. Sid asked for "dark tech blue". -->
