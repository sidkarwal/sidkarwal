  <path d="M0 0 H64 V64 H0Z M32 12 L50 52 H40.5 L37.6 44 H26.4 L23.5 52 H14 Z M32 27 L29.2 35.5 H34.8 Z" fill="#16233A" fill-rule="evenodd"/>
